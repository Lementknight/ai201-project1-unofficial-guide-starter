[project]
name = "ai201-project1"
version = "0.1.0"
description = "The Unofficial Guide — Project 1: a grounded RAG system over collected documents"
authors = [
    { name = "Caleb Aguirre-Leon", email = "39884062+Lementknight@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.10,<4.0"

dependencies = [
    "sentence-transformers (==3.4.1)",
    "chromadb (>=0.6.0)",
    "groq (==0.15.0)",
    "python-dotenv (==1.0.1)",
    "requests (>=2.28.0)",
    "beautifulsoup4 (>=4.12.0)",
    "gradio (>=6.9.0)",
    "playwright (>=1.40.0)",
    "trafilatura (>=1.6.0)",
    "readability-lxml (>=0.8.1)",
]

[project.optional-dependencies]
# Query interface — install whichever you use for Milestone 5:
gradio = ["gradio (>=6.9.0)"]
streamlit = ["streamlit (>=1.40.0)"]
# Document ingestion — install if your documents/ folder contains .pdf files:
pdf = ["pdfplumber (==0.11.4)"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
